# nginx server block for https://microvisionlab.eu.cc
# TLS terminates at Cloudflare; cloudflared forwards to http://localhost:80 with the original Host header.
# Add inside the http { } block of /opt/homebrew/etc/nginx/nginx.conf (or `include` this file there), then:
#   nginx -t && nginx -s reload
server {
  listen 80;
  server_name microvisionlab.eu.cc www.microvisionlab.eu.cc;
  client_max_body_size 30M;

  root /Users/jimingkang/Documents/rewrite-houstonem-com-in-angular/dist/houston-em;
  index index.html;

  # Portal / chat API (npm run api, bound to 127.0.0.1:3001). Same origin, no CORS.
  location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 130s;   # chat waits up to 120s for Ollama
    proxy_buffering off;
  }

  # Hashed build assets can be cached long-term.
  location ~* \.(?:js|css|png|jpg|jpeg|svg|webp|ico|woff2?)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Angular SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
